
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="AQX Market - Currency, gold and silver prices">
  <title>AQX Market Ticker</title>

  <style>
    :root {
      --purple: #7045c5;
      --purple-dark: #52319d;
      --purple-soft: #f2edff;
      --ink: #20243a;
      --muted: #778096;
      --line: #e9eaf2;
      --green: #159b68;
      --red: #e14d5b;
      --neutral: #8b93a5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      background: #f8f9fd;
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    }

    .market {
      width: min(1400px, 100%);
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin-bottom: 12px;
      min-height: 22px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(21,155,104,.10);
    }

    .status-dot.offline {
      background: var(--red);
      box-shadow: 0 0 0 4px rgba(225,77,91,.10);
    }

    .panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 8px 28px rgba(49,38,91,.07);
    }

    .tabs-wrap {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(110deg, #fff, #fbfaff 65%, #f5fbff);
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 9px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      flex: 0 0 auto;
      min-width: 62px;
      padding: 10px 15px;
      border: 1px solid #e8e3f4;
      border-radius: 11px;
      background: #fff;
      color: #555c70;
      font: inherit;
      font-size: 13px;
      font-weight: 850;
      direction: ltr;
      cursor: pointer;
      transition: background .2s, color .2s, border-color .2s;
    }

    .tab:hover {
      border-color: var(--purple);
      color: var(--purple);
    }

    .tab.active {
      border-color: var(--purple);
      background: var(--purple);
      color: #fff;
      box-shadow: 0 4px 12px rgba(112,69,197,.2);
    }

    .ticker-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 18px 8px;
    }

    .ticker-heading strong {
      font-size: 14px;
      font-weight: 850;
    }

    .currency-label {
      color: var(--purple);
      font-size: 12px;
      font-weight: 850;
      direction: ltr;
    }

    .ticker-viewport {
      width: 100%;
      overflow: hidden;
      padding: 7px 0 17px;
      direction: ltr;
    }

    .ticker-track {
      display: flex;
      flex-wrap: nowrap;
      width: max-content;
      gap: 0;
      padding: 0;
      direction: ltr;
      will-change: transform;
      animation: aqxTickerMove var(--ticker-duration, 60s) linear infinite;
      animation-play-state: running !important;
    }

    .ticker-group {
      display: flex;
      flex: 0 0 auto;
      width: max-content;
      gap: 12px;
      padding: 0 6px;
    }

    @keyframes aqxTickerMove {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(-50%);
      }
    }

    .price-card {
      flex: 0 0 185px;
      min-width: 185px;
      min-height: 105px;
      padding: 13px 14px;
      border: 1px solid #ececf3;
      border-radius: 14px;
      background: #fff;
      direction: rtl;
    }

    .price-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .symbol {
      color: #41465b;
      font-size: 12px;
      font-weight: 850;
      direction: ltr;
      text-align: left;
    }

    .asset-type {
      color: #8b91a3;
      font-size: 10px;
    }

    .price-value {
      color: var(--ink);
      font-size: 17px;
      font-weight: 850;
      direction: ltr;
      text-align: right;
      white-space: nowrap;
    }

    .price-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      margin-top: 7px;
      color: var(--muted);
      font-size: 10px;
    }

    .trend {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 900;
      direction: ltr;
    }

    .trend.up { color: var(--green); }
    .trend.down { color: var(--red); }
    .trend.stable { color: var(--neutral); }

    .empty {
      width: 100%;
      padding: 30px 15px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    .footer {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      background: #fcfcff;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 36px;
      border-radius: 10px;
      color: #fff;
      background: linear-gradient(135deg, #8057d4, #5334a2);
      font-size: 16px;
      font-weight: 950;
      letter-spacing: .5px;
      text-decoration: none;
      direction: ltr;
      box-shadow: 0 4px 12px rgba(112,69,197,.2);
    }

    .updated {
      color: var(--muted);
      font-size: 10px;
      direction: rtl;
    }

    @media (max-width: 600px) {
      body { padding: 10px; }
      .tabs-wrap { padding: 11px; }
      .tab { min-width: 55px; padding: 9px 12px; }
      .price-card { flex-basis: 165px; min-width: 165px; }
      .ticker-heading { padding: 13px 13px 7px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ticker-track {
        animation-duration: 180s;
      }
    }
  </style>
</head>

<body>
  <main class="market">

    <header class="topbar">
      <div class="status">
        <span class="status-dot" id="statusDot"></span>
        <span id="connectionStatus">جاري الاتصال</span>
      </div>
    </header>

    <section class="panel" aria-label="AQX Market Ticker">

      <div class="tabs-wrap">
        <nav class="tabs" id="currencyTabs" aria-label="Currencies">
          <button class="tab active" type="button"
            data-currency="USD">USD</button>
        </nav>
      </div>

      <div class="ticker-heading">
        <strong>أسعار السوق</strong>
        <span class="currency-label" id="displayCurrency">USD</span>
      </div>

      <div class="ticker-viewport">
        <div class="ticker-track" id="tickerTrack">
          <div class="empty">جاري تحميل بيانات السوق...</div>
        </div>
      </div>

      <footer class="footer">
        <a class="brand" href="aqx-market.html"
           aria-label="AQX Market">AQX</a>
        <div class="updated" id="lastUpdated">
          بانتظار أول تحديث
        </div>
      </footer>

    </section>
  </main>

  <script>
    "use strict";

    /* ==============================================
       AQX MARKET TICKER
       Central market API
       ============================================== */

    const CONFIG = {
      api: "https://fkiokwwztbyztleeuwks.supabase.co/functions/v1/aqx-market-data/v1/quotes",
      refreshInterval: 60000,
      requestTimeout: 20000,

      // Three selectable currencies plus the visitor's local currency.
      optionalCurrencies: ["EUR", "GBP", "SAR"],

      // Four additional currencies can be selected here.
      fallbackCurrencies: ["AED", "KWD", "CAD", "JPY", "CHF", "EGP"]
    };

    const state = {
      displayCurrency: "USD",
      localCurrency: "EGP",
      latestQuotes: [],
      previousPrices: {},
      lastSuccessfulUpdate: null,
      loading: false,
      requestNumber: 0
    };

    const elements = {
      tabs: document.getElementById("currencyTabs"),
      track: document.getElementById("tickerTrack"),
      displayCurrency: document.getElementById("displayCurrency"),
      lastUpdated: document.getElementById("lastUpdated"),
      status: document.getElementById("connectionStatus"),
      statusDot: document.getElementById("statusDot")
    };

    /* Visitor country and currency detection */

    function detectVisitor() {
      let locale = navigator.languages?.[0] ||
                   navigator.language ||
                   "en-US";

      let region = "US";

      try {
        region = new Intl.Locale(locale).region || "US";
      } catch (_) {
        const match = locale.match(/[-_]([A-Z]{2})/i);
        if (match) region = match[1].toUpperCase();
      }

      const currencies = {
        EG: "EGP", SA: "SAR", AE: "AED",
        KW: "KWD", QA: "QAR", BH: "BHD",
        OM: "OMR", JO: "JOD", GB: "GBP",
        US: "USD", CA: "CAD", AU: "AUD",
        NZ: "NZD", CH: "CHF", JP: "JPY",
        CN: "CNY", IN: "INR", TR: "TRY",
        DE: "EUR", FR: "EUR", IT: "EUR",
        ES: "EUR", NL: "EUR", BE: "EUR",
        AT: "EUR", PT: "EUR", IE: "EUR",
        GR: "EUR", MX: "MXN", BR: "BRL",
        ZA: "ZAR", SG: "SGD", HK: "HKD",
        SE: "SEK", NO: "NOK", DK: "DKK",
        PL: "PLN", KR: "KRW", RU: "RUB"
      };

      return {
        locale,
        region,
        currency: currencies[region] || "USD"
      };
    }

    const visitor = detectVisitor();
    state.localCurrency = visitor.currency;

    /* Currency tabs */

    function buildCurrencyTabs() {
      const optional = CONFIG.optionalCurrencies.filter(
        code => code !== state.localCurrency
      );

      for (const code of CONFIG.fallbackCurrencies) {
        if (optional.length >= 3) break;

        if (
          code !== state.localCurrency &&
          !optional.includes(code)
        ) {
          optional.push(code);
        }
      }

      const currencies = [
        "USD",
        ...optional.slice(0, 3),
        state.localCurrency
      ];

      const uniqueCurrencies = [...new Set(currencies)];

      elements.tabs.innerHTML = "";

      uniqueCurrencies.forEach(currency => {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "tab";
        button.dataset.currency = currency;
        button.textContent = currency;
        button.setAttribute("aria-pressed", "false");

        button.addEventListener("click", () => {
          selectCurrency(currency);
        });

        elements.tabs.appendChild(button);
      });

      selectCurrency("USD", false);
    }

    function selectCurrency(currency, reload = true) {
      if (state.displayCurrency === currency && !reload) {
        updateActiveTab();
        return;
      }

      state.displayCurrency = currency;
      elements.displayCurrency.textContent = currency;

      updateActiveTab();

      if (reload) {
        loadMarketData();
      }
    }

    function updateActiveTab() {
      elements.tabs.querySelectorAll(".tab").forEach(button => {
        const active =
          button.dataset.currency === state.displayCurrency;

        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });
    }

    /* API */

    function makeApiUrl(assetType, currency) {
      const url = new URL(CONFIG.api);

      url.searchParams.set("currency", currency);
      url.searchParams.set("asset_type", assetType);

      return url.toString();
    }

    async function fetchAssetType(assetType, currency, requestId) {
      const controller = new AbortController();

      const timeout = setTimeout(
        () => controller.abort(),
        CONFIG.requestTimeout
      );

      try {
        const response = await fetch(
          makeApiUrl(assetType, currency),
          {
            method: "GET",
            headers: {
              "Accept": "application/json"
            },
            cache: "no-store",
            signal: controller.signal
          }
        );

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const payload = await response.json();

        if (requestId !== state.requestNumber) {
          throw new Error("Outdated request");
        }

        if (payload.success === false) {
          throw new Error(
            payload.message || "API request failed"
          );
        }

        if (Array.isArray(payload.data)) {
          return payload.data;
        }

        if (Array.isArray(payload.quotes)) {
          return payload.quotes;
        }

        throw new Error("Unexpected API response format");

      } finally {
        clearTimeout(timeout);
      }
    }

    /* Price handling */

    function getDisplayPrice(item) {
      const value = item.display_price ?? item.price;
      const number = Number(value);

      return Number.isFinite(number) ? number : null;
    }

    function getDisplayUnit(item) {
      return item.display_unit ||
             item.display_currency ||
             state.displayCurrency;
    }

    function getStableKey(item, currency) {
      return String(item.symbol || "UNKNOWN") + "|" + currency;
    }

    function getTrend(item, currentPrice, currency) {
      const key = getStableKey(item, currency);
      const previous = state.previousPrices[key];

      if (!Number.isFinite(previous)) {
        return {
          className: "stable",
          symbol: "●",
          label: "مستقر"
        };
      }

      const tolerance = Math.max(
        Math.abs(previous) * 0.00000001,
        0.000000001
      );

      if (currentPrice > previous + tolerance) {
        return {
          className: "up",
          symbol: "▲",
          label: "صاعد"
        };
      }

      if (currentPrice < previous - tolerance) {
        return {
          className: "down",
          symbol: "▼",
          label: "هابط"
        };
      }

      return {
        className: "stable",
        symbol: "●",
        label: "مستقر"
      };
    }

    function formatPrice(value) {
      return new Intl.NumberFormat("en-US", {
        maximumFractionDigits: 8,
        minimumFractionDigits: 0,
        useGrouping: true
      }).format(value);
    }

    function formatUpdateTime(date) {
      return new Intl.DateTimeFormat("en-GB", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).format(date);
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(
        /[&<>"']/g,
        character => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        })[character]
      );
    }

    function getAssetLabel(item) {
      const type = String(
        item.asset_type || ""
      ).toLowerCase();

      if (type.includes("metal")) return "معدن";
      if (type.includes("currency") || type.includes("fx")) {
        return "عملة";
      }

      return "";
    }

    /* Card rendering */

    function createCard(item, currency) {
      const price = getDisplayPrice(item);

      if (price === null) return "";

      const trend = getTrend(item, price, currency);
      const symbol = escapeHtml(item.symbol || "—");
      const unit = escapeHtml(getDisplayUnit(item));
      const label = escapeHtml(getAssetLabel(item));

      return `
        <article class="price-card"
          data-symbol="${symbol}">
          <div class="price-top">
            <span class="symbol">${symbol}</span>
            <span class="asset-type">${label}</span>
          </div>

          <div class="price-value">
            ${formatPrice(price)}
          </div>

          <div class="price-bottom">
            <span>${unit}</span>
            <span class="trend ${trend.className}"
              aria-label="${trend.label}">
              ${trend.symbol}
            </span>
          </div>
        </article>
      `;
    }

    /*
      Update card contents without restarting the ticker animation
      when the symbols list remains unchanged.
    */

    function renderQuotes(quotes, currency) {
      const validQuotes = quotes.filter(
        item => getDisplayPrice(item) !== null
      );

      if (!validQuotes.length) {
        if (!state.latestQuotes.length) {
          elements.track.innerHTML =
            '<div class="empty">لا توجد بيانات متاحة حاليًا.</div>';
        }
        return;
      }

      const cards = validQuotes.map(
        item => createCard(item, currency)
      );

      const firstGroup = elements.track.querySelector(
        ".ticker-group"
      );

      const secondGroup = elements.track.querySelector(
        ".ticker-group.clone"
      );

      const sameSymbols = firstGroup &&
        firstGroup.children.length === cards.length &&
        [...firstGroup.children].every(
          (card, index) =>
            card.dataset.symbol ===
            String(validQuotes[index].symbol || "—")
        );

      if (sameSymbols && secondGroup) {
        cards.forEach((html, index) => {
          firstGroup.children[index].outerHTML = html;
          secondGroup.children[index].outerHTML = html;
        });
        return;
      }

      elements.track.innerHTML = `
        <div class="ticker-group">
          ${cards.join("")}
        </div>
        <div class="ticker-group clone" aria-hidden="true">
          ${cards.join("")}
        </div>
      `;

      const group = elements.track.querySelector(
        ".ticker-group"
      );

      const distance = group.getBoundingClientRect().width;
      const pixelsPerSecond = 75;

      elements.track.style.setProperty(
        "--ticker-duration",
        Math.max(20, distance / pixelsPerSecond) + "s"
      );
    }

    /* Connection status */

    function setConnection(connected, message) {
      elements.status.textContent = message;

      elements.statusDot.classList.toggle(
        "offline",
        !connected
      );
    }

    /* Main refresh */

    async function loadMarketData() {
      if (state.loading) return;

      state.loading = true;

      const requestId = ++state.requestNumber;
      const requestedCurrency = state.displayCurrency;

      try {
        const results = await Promise.all([
          fetchAssetType(
            "currency",
            requestedCurrency,
            requestId
          ),
          fetchAssetType(
            "metal",
            requestedCurrency,
            requestId
          )
        ]);

        if (
          requestId !== state.requestNumber ||
          requestedCurrency !== state.displayCurrency
        ) {
          return;
        }

        const combined = [
          ...results[0],
          ...results[1]
        ];

        if (!combined.length) {
          throw new Error("Empty market response");
        }

        const validQuotes = combined.filter(
          item => getDisplayPrice(item) !== null
        );

        if (!validQuotes.length) {
          throw new Error("No valid price values");
        }

        /*
          Render first, so trend indicators compare the new
          prices against the previous successful readings.
        */

        renderQuotes(validQuotes, requestedCurrency);

        /*
          Save prices only after successful rendering.
        */

        validQuotes.forEach(item => {
          const price = getDisplayPrice(item);
          const key = getStableKey(
            item,
            requestedCurrency
          );

          state.previousPrices[key] = price;
        });

        state.latestQuotes = validQuotes;
        state.lastSuccessfulUpdate = new Date();

        elements.lastUpdated.textContent =
          "آخر تحديث ناجح: " +
          formatUpdateTime(state.lastSuccessfulUpdate);

        setConnection(true, "متصل");

      } catch (error) {
        if (requestId !== state.requestNumber) return;

        setConnection(false, "تعذر الاتصال");

        if (state.lastSuccessfulUpdate) {
          elements.lastUpdated.textContent =
            "آخر تحديث ناجح: " +
            formatUpdateTime(state.lastSuccessfulUpdate);
        } else {
          elements.lastUpdated.textContent =
            "بانتظار أول تحديث ناجح";
        }

        console.warn("AQX Market API:", error);

      } finally {
        if (requestId === state.requestNumber) {
          state.loading = false;
        }
      }
    }

    /* Initialization */

    buildCurrencyTabs();

    loadMarketData();

    // Automatic market refresh every 60 seconds.
    window.setInterval(() => {
      loadMarketData();
    }, CONFIG.refreshInterval);

    // Refresh when the browser tab becomes visible again.
    document.addEventListener(
      "visibilitychange",
      () => {
        if (!document.hidden) {
          loadMarketData();
        }
      }
    );

  </script>
</body>
</html>
