<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="AQX Market Ticker - Live currencies, gold and silver market prices.">
  <title>AQX Market Ticker</title>

  <style>
    :root {
      --purple: #7045c5;
      --purple-dark: #52319d;
      --purple-soft: #f2edff;
      --blue-soft: #eaf7ff;
      --ink: #20243a;
      --muted: #778096;
      --line: #e9eaf2;
      --surface: #ffffff;
      --green: #159b68;
      --red: #e14d5b;
      --neutral: #8b93a5;
      --shadow: 0 8px 28px rgba(49, 38, 91, .07);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 22px;
      background: #f8f9fd;
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    }

    .market {
      width: min(1200px, 100%);
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 17px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 42px;
      border-radius: 13px;
      color: #fff;
      background: linear-gradient(135deg, #8057d4, #5334a2);
      font-size: 19px;
      font-weight: 900;
      letter-spacing: .5px;
      text-decoration: none;
      box-shadow: 0 5px 14px rgba(112, 69, 197, .2);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(21, 155, 104, .1);
    }

    .status-dot.offline {
      background: var(--red);
      box-shadow: 0 0 0 4px rgba(225, 77, 91, .1);
    }

    .panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .tabs-wrap {
      padding: 15px 16px 12px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(110deg, #fff, #fbfaff 65%, #f5fbff);
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 9px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      flex: 0 0 auto;
      min-width: 62px;
      padding: 10px 15px;
      border: 1px solid #e8e3f4;
      border-radius: 11px;
      background: #fff;
      color: #555c70;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: .2s ease;
    }

    .tab:hover {
      border-color: var(--purple);
      color: var(--purple);
    }

    .tab.active {
      border-color: var(--purple);
      background: var(--purple);
      color: #fff;
      box-shadow: 0 4px 12px rgba(112, 69, 197, .2);
    }

    .ticker-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 19px 10px;
    }

    .ticker-heading strong {
      font-size: 14px;
      font-weight: 850;
    }

    .currency-label {
      color: var(--purple);
      font-size: 12px;
      font-weight: 800;
      direction: ltr;
    }

    .ticker-viewport {
      overflow: hidden;
      padding: 5px 0 17px;
    }

    .ticker-track {
      display: flex;
      width: max-content;
      gap: 12px;
      padding: 0 16px;
      animation: ticker-scroll 65s linear infinite;
      direction: ltr;
    }

    .ticker-track:hover {
      animation-play-state: paused;
    }

    @keyframes ticker-scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-35%); }
    }

    .price-card {
      flex: 0 0 185px;
      min-height: 104px;
      padding: 13px 14px;
      border: 1px solid #ececf3;
      border-radius: 14px;
      background: #fff;
      direction: rtl;
    }

    .price-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .symbol {
      color: #41465b;
      font-size: 12px;
      font-weight: 850;
      direction: ltr;
    }

    .asset-type {
      color: #8b91a3;
      font-size: 10px;
    }

    .price-value {
      color: var(--ink);
      font-size: 17px;
      font-weight: 850;
      direction: ltr;
      text-align: right;
      white-space: nowrap;
    }

    .price-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      margin-top: 7px;
      color: var(--muted);
      font-size: 10px;
    }

    .trend {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 900;
      direction: ltr;
    }

    .trend.up { color: var(--green); }
    .trend.down { color: var(--red); }
    .trend.stable { color: var(--neutral); }

    .empty {
      width: 100%;
      padding: 30px 15px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    .footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 17px;
      border-top: 1px solid var(--line);
      background: #fcfcff;
    }

    .disclaimer {
      max-width: 790px;
      color: #81889a;
      font-size: 10px;
      line-height: 1.8;
    }

    .updated {
      color: var(--muted);
      font-size: 10px;
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      body { padding: 12px; }
      .topbar { margin-bottom: 12px; }
      .tabs-wrap { padding: 12px; }
      .tab { min-width: 56px; padding: 9px 12px; }
      .price-card { flex-basis: 165px; }
      .ticker-heading { padding: 13px 14px 8px; }
      .footer { align-items: flex-start; flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ticker-track { animation: none; }
      * { scroll-behavior: auto !important; }
    }
  </style>
</head>

<body>
  <main class="market">
    <header class="topbar">
      <!-- يمكن تغيير الوجهة عند تحديد صفحة شعار AQX المستقلة -->
      <a class="brand" id="aqxBrand" href="https://alqurmanix.com/"
         target="_blank" rel="noopener noreferrer" aria-label="AQX">AQX</a>

      <div class="status">
        <span class="status-dot" id="statusDot"></span>
        <span id="connectionStatus">جاري الاتصال</span>
      </div>
    </header>

    <section class="panel" aria-label="AQX Market Ticker">
      <div class="tabs-wrap">
        <nav class="tabs" id="currencyTabs" aria-label="Currencies">
          <button class="tab active" type="button" data-currency="USD">USD</button>
        </nav>
      </div>

      <div class="ticker-heading">
        <strong>أسعار السوق</strong>
        <span class="currency-label" id="displayCurrency">USD</span>
      </div>

      <div class="ticker-viewport">
        <div class="ticker-track" id="tickerTrack">
          <div class="empty">جاري تحميل بيانات السوق...</div>
        </div>
      </div>

      <footer class="footer">
        <div class="disclaimer">
          الأسعار المعروضة استرشادية، وتعكس آخر البيانات المتاحة من مصادر السوق،
          ولا تمثل عرضًا ملزمًا للبيع أو الشراء أو سعر تنفيذ مضمونًا.
        </div>
        <div class="updated" id="lastUpdated">لم يتم التحديث بعد</div>
      </footer>
    </section>
  </main>

  <script>
    "use strict";

    /* =====================================================
       AQX MARKET TICKER
       Existing central market API - no secret keys in browser
       ===================================================== */

    const CONFIG = {
      api: "https://fkiokwwztbyztleeuwks.supabase.co/functions/v1/aqx-market-data/v1/quotes",
      refreshInterval: 60 * 1000,
      requestTimeout: 15000,

      // USD is the default tab. Four other tabs are selectable.
      optionalCurrencies: ["EUR", "GBP", "SAR", "AED"],

      // Change this only when the dedicated AQX brand page is supplied.
      brandUrl: "https://alqurmanix.com/"
    };

    const state = {
      displayCurrency: "USD",
      localCurrency: "EGP",
      latestQuotes: [],
      previousPrices: {},
      lastSuccessfulUpdate: null,
      loading: false,
      failed: false
    };

    const elements = {
      tabs: document.getElementById("currencyTabs"),
      track: document.getElementById("tickerTrack"),
      displayCurrency: document.getElementById("displayCurrency"),
      lastUpdated: document.getElementById("lastUpdated"),
      status: document.getElementById("connectionStatus"),
      statusDot: document.getElementById("statusDot"),
      brand: document.getElementById("aqxBrand")
    };

    elements.brand.href = CONFIG.brandUrl;

    function detectVisitor() {
      let locale = "en-US";

      try {
        locale = navigator.languages?.[0] ||
                 navigator.language ||
                 "en-US";
      } catch (_) {}

      let region = "US";

      try {
        const localeObject = new Intl.Locale(locale);
        region = localeObject.region || "US";
      } catch (_) {
        const match = locale.match(/[-_]([A-Z]{2})\b/i);
        if (match) region = match[1].toUpperCase();
      }

      const regionCurrency = {
        EG: "EGP", SA: "SAR", AE: "AED", KW: "KWD",
        QA: "QAR", BH: "BHD", OM: "OMR", JO: "JOD",
        GB: "GBP", US: "USD", CA: "CAD", AU: "AUD",
        NZ: "NZD", CH: "CHF", JP: "JPY", CN: "CNY",
        IN: "INR", TR: "TRY", DE: "EUR", FR: "EUR",
        IT: "EUR", ES: "EUR", NL: "EUR", BE: "EUR",
        AT: "EUR", PT: "EUR", IE: "EUR", GR: "EUR",
        MX: "MXN", BR: "BRL", ZA: "ZAR", SG: "SGD",
        HK: "HKD", SE: "SEK", NO: "NOK", DK: "DKK",
        PL: "PLN", KR: "KRW", RU: "RUB"
      };

      return {
        locale,
        region,
        currency: regionCurrency[region] || "USD"
      };
    }

    const visitor = detectVisitor();
    state.localCurrency = visitor.currency;

    function buildCurrencyTabs() {
      const optional = [...CONFIG.optionalCurrencies];

      // The local currency is always the last optional tab.
      // If it already exists in the fixed options, remove the duplicate.
      const filtered = optional.filter(code => code !== state.localCurrency);

      // Ensure four optional currencies, without duplicates.
      const fallback = ["CAD", "JPY", "CHF", "INR", "KWD", "EGP"];
      for (const code of fallback) {
        if (filtered.length >= 3) break;
        if (code !== state.localCurrency && !filtered.includes(code)) {
          filtered.push(code);
        }
      }

      const choices = ["USD", ...filtered.slice(0, 3), state.localCurrency];
      const uniqueChoices = [...new Set(choices)];

      elements.tabs.innerHTML = "";

      uniqueChoices.forEach(code => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "tab";
        button.dataset.currency = code;
        button.textContent = code;
        button.addEventListener("click", () => selectCurrency(code));
        elements.tabs.appendChild(button);
      });

      selectCurrency("USD", false);
    }

    function selectCurrency(currency, reload = true) {
      state.displayCurrency = currency;

      elements.tabs.querySelectorAll(".tab").forEach(button => {
        const active = button.dataset.currency === currency;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });

      elements.displayCurrency.textContent = currency;

      if (reload) {
        loadMarketData();
      }
    }

    function makeApiUrl(assetType) {
      const url = new URL(CONFIG.api);
      url.searchParams.set("currency", state.displayCurrency);
      url.searchParams.set("asset_type", assetType);

      // Send visitor locale information as context.
      // The API may ignore parameters it does not use.
      url.searchParams.set("locale", visitor.locale);
      url.searchParams.set("country", visitor.region);

      return url.toString();
    }

    async function fetchAssetType(assetType) {
      const controller = new AbortController();
      const timeout = setTimeout(
        () => controller.abort(),
        CONFIG.requestTimeout
      );

      try {
        const response = await fetch(makeApiUrl(assetType), {
          method: "GET",
          headers: { "Accept": "application/json" },
          cache: "no-store",
          signal: controller.signal
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const payload = await response.json();

        if (payload.success === false) {
          throw new Error(payload.message || "API request failed");
        }

        if (Array.isArray(payload.data)) return payload.data;
        if (Array.isArray(payload.quotes)) return payload.quotes;

        throw new Error("Unexpected API response format");
      } finally {
        clearTimeout(timeout);
      }
    }

    function getDisplayPrice(item) {
      const value = item.display_price ?? item.price;
      const number = Number(value);
      return Number.isFinite(number) ? number : null;
    }

    function getDisplayUnit(item) {
      return item.display_unit ||
             item.unit ||
             item.display_currency ||
             state.displayCurrency;
    }

    function getStableKey(item) {
      return [
        item.symbol || "UNKNOWN",
        state.displayCurrency
      ].join("|");
    }

    function getTrend(item, currentPrice) {
      const key = getStableKey(item);
      const previous = state.previousPrices[key];

      if (!Number.isFinite(previous) || !Number.isFinite(currentPrice)) {
        return { className: "stable", symbol: "●", label: "مستقر" };
      }

      const tolerance = Math.max(Math.abs(previous) * 0.00000001, 0.000000001);

      if (currentPrice > previous + tolerance) {
        return { className: "up", symbol: "▲", label: "صاعد" };
      }

      if (currentPrice < previous - tolerance) {
        return { className: "down", symbol: "▼", label: "هابط" };
      }

      return { className: "stable", symbol: "●", label: "مستقر" };
    }

    function rememberPrices(quotes) {
      const next = {};

      quotes.forEach(item => {
        const price = getDisplayPrice(item);
        if (price === null) return;

        next[getStableKey(item)] = price;
      });

      // Keep only successfully received values.
      state.previousPrices = {
        ...state.previousPrices,
        ...next
      };
    }

    function formatPrice(value) {
      return new Intl.NumberFormat(visitor.locale, {
        maximumFractionDigits: 6,
        minimumFractionDigits: 0
      }).format(value);
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function getAssetLabel(item) {
      const type = String(item.asset_type || "").toLowerCase();

      if (type.includes("metal")) return "معدن";
      if (type.includes("currency") || type.includes("fx")) return "عملة";

      return "";
    }

    function createCard(item) {
      const price = getDisplayPrice(item);
      if (price === null) return "";

      const trend = getTrend(item, price);
      const symbol = escapeHtml(item.symbol || "—");
      const unit = escapeHtml(getDisplayUnit(item));
      const assetLabel = escapeHtml(getAssetLabel(item));

      return `
        <article class="price-card">
          <div class="price-top">
            <span class="symbol">${symbol}</span>
            <span class="asset-type">${assetLabel}</span>
          </div>

          <div class="price-value">${formatPrice(price)}</div>

          <div class="price-bottom">
            <span>${unit}</span>
            <span class="trend ${trend.className}"
                  aria-label="${trend.label}">
              ${trend.symbol}
            </span>
          </div>
        </article>
      `;
    }

    function renderQuotes(quotes) {
      const validQuotes = quotes.filter(item => getDisplayPrice(item) !== null);

      if (!validQuotes.length) {
        elements.track.innerHTML =
          '<div class="empty">لا توجد أسعار متاحة حاليًا.</div>';
        return;
      }

      const cards = validQuotes.map(createCard).join("");

      // Duplicate cards to create a continuous ticker effect.
      elements.track.innerHTML = cards + cards;

      // Reduce motion for a short list, avoiding excessive empty movement.
      elements.track.style.animationDuration =
        Math.max(25, validQuotes.length * 5) + "s";
    }

    function setConnection(connected, message) {
      elements.status.textContent = message;
      elements.statusDot.classList.toggle("offline", !connected);
    }

    function formatUpdateTime(date) {
      return new Intl.DateTimeFormat(visitor.locale, {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }).format(date);
    }

    async function loadMarketData() {
      if (state.loading) return;
      state.loading = true;

      try {
        const [currencies, metals] = await Promise.all([
          fetchAssetType("currency"),
          fetchAssetType("metal")
        ]);

        const combined = [...currencies, ...metals];

        // Ignore an empty response; do not replace the last good display.
        if (!combined.length) {
          throw new Error("Empty market response");
        }

        rememberPrices(combined);

        state.latestQuotes = combined;
        state.lastSuccessfulUpdate = new Date();
        state.failed = false;

        renderQuotes(state.latestQuotes);
        elements.lastUpdated.textContent =
          "آخر تحديث ناجح: " +
          formatUpdateTime(state.lastSuccessfulUpdate);

        setConnection(true, "متصل");
      } catch (error) {
        state.failed = true;

        // Preserve the last successful readings.
        if (state.latestQuotes.length) {
          renderQuotes(state.latestQuotes);
        }

        setConnection(false, "تعذر الاتصال");

        if (state.lastSuccessfulUpdate) {
          elements.lastUpdated.textContent =
            "آخر تحديث ناجح: " +
            formatUpdateTime(state.lastSuccessfulUpdate) +
            " · البيانات السابقة محفوظة";
        } else {
          elements.lastUpdated.textContent = "بانتظار أول تحديث ناجح";
          elements.track.innerHTML =
            '<div class="empty">تعذر جلب البيانات. ستتم إعادة المحاولة تلقائيًا.</div>';
        }

        console.warn("AQX Market API:", error);
      } finally {
        state.loading = false;
      }
    }

    // Start the interface.
    buildCurrencyTabs();
    loadMarketData();

    // Automatic refresh every 60 seconds.
    window.setInterval(loadMarketData, CONFIG.refreshInterval);

    // Refresh when the visitor returns to the browser tab.
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) loadMarketData();
    });
  </script>
</body>
</html>
